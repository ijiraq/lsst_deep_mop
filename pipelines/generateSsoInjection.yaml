description: >
  Generate per-visit/detector synthetic SSO Trail catalogs (SD-MOC sampling)
  for InjectSsoVisitTask / stock VisitInjectTask GalSim injection.
  Multiple named populations are sampled and concatenated into one catalog.
tasks:
  generateSsoInjectionCatalog:
    class: sso_injection.GenerateSsoInjectionCatalogTask
    config:
      # CONFIGURATION POINT: named orbit populations / SD-MOC models.
      # When populations.* is set, the single ``population`` fallback is ignored.
      populations.centaur.density: 600
      populations.centaur.master_seed: 20240611
      populations.centaur.model_epoch_mjd: 59374.0
      populations.centaur.healpix_order: 8
      populations.centaur.distance_inner_au: 5.0
      populations.centaur.distance_outer_au: 20.0
      populations.centaur.n_distance_bins: 4
      populations.centaur.mag_limits: [22.0, 27.0]
      populations.centaur.h_limits: [5.0, 21.0]
      populations.centaur.eccentricity_max: 0.8
      populations.centaur.inclination_max_deg: 60.0
      populations.centaur.eccentricity_fuzz: 0.2
      populations.centaur.inclination_fuzz_deg: 5.0
      populations.centaur.source_type: Trail

      populations.tno.density: 1200
      populations.tno.master_seed: 20240611
      populations.tno.model_epoch_mjd: 59374.0
      populations.tno.healpix_order: 8
      populations.tno.distance_inner_au: 30.0
      populations.tno.distance_outer_au: 50.0
      populations.tno.n_distance_bins: 6
      populations.tno.mag_limits: [22.0, 27.0]
      populations.tno.h_limits: [3.0, 13.0]
      populations.tno.eccentricity_max: 0.5
      populations.tno.inclination_max_deg: 30.0
      populations.tno.eccentricity_fuzz: 0.2
      populations.tno.inclination_fuzz_deg: 5.0
      populations.tno.source_type: Trail

      populations.sdo.density: 600
      populations.sdo.master_seed: 20240611
      populations.sdo.model_epoch_mjd: 59374.0
      populations.sdo.healpix_order: 8
      populations.sdo.distance_inner_au: 60.0
      populations.sdo.distance_outer_au: 80.0
      populations.sdo.n_distance_bins: 2
      populations.sdo.mag_limits: [22.0, 27.0]
      populations.sdo.h_limits: [1.0, 10.0]
      populations.sdo.eccentricity_max: 0.8
      populations.sdo.inclination_max_deg: 60.0
      populations.sdo.eccentricity_fuzz: 0.2
      populations.sdo.inclination_fuzz_deg: 5.0
      populations.sdo.source_type: Trail
