    description: All tasks from the 'step2d' subset impacted by source injection.
  injected_step2e:
    subset:
    - makeCcdVisitTable
    - makeVisitTable
    description: All tasks from the 'step2e' subset impacted by source injection.
  injected_step3:
    subset:
    - mergeMeasurements
    - makePsfMatchedWarp
    - mergeDetections
    - catalogMatchTract
    - deblend
    - plotPropertyMapTract
    - detection
